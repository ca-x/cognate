name: Native desktop

on:
  pull_request:
    paths:
      - 'cmd/cognate-desktop/**'
      - 'internal/desktop/**'
      - 'internal/importclient/**'
      - 'internal/packclient/**'
      - 'internal/subscription/**'
      - 'internal/install/**'
      - 'internal/state/**'
      - 'assets/branding/**'
      - 'internal/codexconfig/testdata/native-0.166.0/LICENSE'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft release after all packaging jobs pass
        type: boolean
        default: false
      tag:
        description: Existing desktop-v0.1.0 tag to publish (must match checked out ref)
        type: string
        default: ''

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  CODEX_LICENSE_SOURCE: internal/codexconfig/testdata/native-0.166.0/LICENSE
  CODEX_LICENSE_SHA256: 85e1d58a617d42cc2095caf2a4b4bac26d3d260b4907e3e7020be545192c6aa6

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Verify Codex legal input
        run: |
          test -f "$CODEX_LICENSE_SOURCE"
          test ! -L "$CODEX_LICENSE_SOURCE"
          printf '%s  %s\n' "$CODEX_LICENSE_SHA256" "$CODEX_LICENSE_SOURCE" | sha256sum -c -
      - name: Native text and GTK runtime
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libepoxy0 libgl1-mesa-dri fonts-noto-cjk xvfb xauth
      - name: Headless native HTTP integration tests
        run: env -u DISPLAY -u WAYLAND_DISPLAY go test -mod=readonly -count=1 -timeout=120s ./internal/desktop ./cmd/cognate-desktop
      - run: go vet ./internal/desktop ./cmd/cognate-desktop
      - run: go tool mygo vet cmd/cognate-desktop
      - run: go tool mygo vet internal/desktop
      - name: Six CGO-disabled targets and forbidden dependency guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/cross
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              suffix=''
              if [ "$os" = windows ]; then suffix='.exe'; fi
              GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -o "dist/cross/cognate-desktop-$os-$arch$suffix" ./cmd/cognate-desktop
              GOOS="$os" GOARCH="$arch" go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./cmd/cognate-desktop > dist/cross/cgo-check.txt
              test ! -s dist/cross/cgo-check.txt
            done
          done
          cp "$CODEX_LICENSE_SOURCE" dist/cross/LICENSE
          cmp "$CODEX_LICENSE_SOURCE" dist/cross/LICENSE
          go list -deps ./cmd/cognate-desktop > dist/cross/dependencies.txt
          if grep -E '^github[.]com/(ca-x/cognate/internal/(server|cli)|MoeForge/moejs|spf13/cobra)(/|$)' dist/cross/dependencies.txt; then exit 1; fi
      - name: Real native window smoke (no installation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/smoke
          export HOME="$(mktemp -d)"
          xvfb-run -a dist/cross/cognate-desktop-linux-amd64 -smoke=2s -capture="$GITHUB_WORKSPACE/dist/smoke/native-content.png" 2>&1 | tee dist/smoke/native.log
          grep NATIVE_WINDOW_CREATED dist/smoke/native.log
          grep NATIVE_CAPTURE_OK dist/smoke/native.log
          test -s dist/smoke/native-content.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-verification
          path: dist/
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: desktop-verification
          path: ${{ runner.temp }}/cognate-desktop-legal
      - name: Verify uploaded cross-build license payload
        timeout-minutes: 2
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/cognate-desktop-legal
        run: |
          set -euo pipefail
          legal="$ARTIFACT_DIR/cross/LICENSE"
          test -f "$legal"
          test ! -L "$legal"
          printf '%s  %s\n' "$CODEX_LICENSE_SHA256" "$legal" | sha256sum -c -

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
          - runner: windows-2025
            platform: windows
          - runner: macos-15
            platform: darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Install NSIS (do not silently skip Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Package native apps (macOS ad-hoc only, not Developer ID signed)
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          if ! command -v "$python" >/dev/null; then python=python; fi
          "$python" - <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          legal = pathlib.Path(os.environ["CODEX_LICENSE_SOURCE"])
          if not stat.S_ISREG(legal.lstat().st_mode) or hashlib.sha256(legal.read_bytes()).hexdigest() != os.environ["CODEX_LICENSE_SHA256"]:
              raise SystemExit("Codex legal input rejected")
          PY
          go tool mygo build -platform '${{ matrix.platform }}/amd64,${{ matrix.platform }}/arm64' -sign '-' -skip-notarize -o "$GITHUB_WORKSPACE/dist/desktop" cmd/cognate-desktop
      - name: Verify packaged Go and source identities
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$PACKAGE_PLATFORM" in
              windows) executable="dist/desktop/windows-$arch/Cognate.exe" ;;
              darwin) executable="dist/desktop/darwin-$arch/Cognate.app/Contents/MacOS/Cognate" ;;
              linux) executable="dist/desktop/linux-$arch/cognate-desktop" ;;
              *) exit 1 ;;
            esac
            metadata="$(go version -m "$executable")"
            grep -qE '^.*: go1\.27\.3$' <<< "$metadata"
            for setting in "CGO_ENABLED=0" "GOOS=$PACKAGE_PLATFORM" "GOARCH=$arch" "vcs.revision=$GITHUB_SHA" "vcs.modified=false"; do
              if ! grep -qFx $'\tbuild\t'"$setting" <<< "$metadata"; then
                printf 'Packaged metadata rejected %s/%s: %s\n' "$PACKAGE_PLATFORM" "$arch" "$setting" >&2
                exit 1
              fi
            done
            printf 'Packaged identity verified for %s/%s\n' "$PACKAGE_PLATFORM" "$arch"
          done
      - name: Assert both Windows Setup executables exist
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          foreach ($arch in @('amd64', 'arm64')) {
            $setup = Get-ChildItem dist/desktop -Recurse -Filter "*-setup-*-$arch.exe"
            if (-not $setup) { throw "Missing NSIS Setup for $arch; MyGo may have skipped installer creation" }
            foreach ($file in $setup) { if ($file.Length -eq 0) { throw 'Empty Setup' } }
          }
      - name: Assert macOS application bundles and DMGs
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -n "$(find dist/desktop -type f -name "*-$arch.dmg" -print -quit)"
          done
          test -n "$(find dist/desktop -type d -name '*.app' -print -quit)"
      - name: Assert Linux archives and Debian packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -n "$(find dist/desktop -type f -name "*-linux-$arch.tar.gz" -print -quit)"
          done
          test -n "$(find dist/desktop -type f -name '*.deb' -print -quit)"
      - name: Verify actual packaged Codex license payloads
        timeout-minutes: 8
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python=python3
          if ! command -v "$python" >/dev/null; then python=python; fi
          "$python" - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil
          import stat
          import subprocess
          import tarfile
          import tempfile
          import threading

          expected = os.environ["CODEX_LICENSE_SHA256"]
          canonical = pathlib.Path(os.environ["CODEX_LICENSE_SOURCE"])
          if not stat.S_ISREG(canonical.lstat().st_mode):
              raise SystemExit("Codex legal input is not a regular file")
          original = canonical.read_bytes()
          if hashlib.sha256(original).hexdigest() != expected:
              raise SystemExit("Codex legal input hash rejected")

          def verify_bytes(body):
              if len(body) != len(original) or hashlib.sha256(body).hexdigest() != expected:
                  raise SystemExit("Packaged Codex LICENSE or NOTICE differs")

          def verify_file(path):
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Packaged Codex legal file is not regular")
              with path.open("rb") as stream:
                  verify_bytes(stream.read(len(original) + 1))

          def one_file(directory, pattern):
              matches = list(directory.glob(pattern))
              if len(matches) != 1 or not stat.S_ISREG(matches[0].lstat().st_mode):
                  raise SystemExit("Expected exactly one regular native package")
              return matches[0]

          def verify_tar(archive, target):
              found = 0
              for entry in archive:
                  if entry.name not in (target, "./" + target):
                      continue
                  if not entry.isfile() or entry.size != len(original):
                      raise SystemExit("Archive legal member rejected")
                  with archive.extractfile(entry) as stream:
                      verify_bytes(stream.read(len(original) + 1))
                  found += 1
              if found != 1:
                  raise SystemExit("Archive must contain exactly one Codex legal member")

          platform = os.environ["PACKAGE_PLATFORM"]
          if platform not in ("linux", "darwin", "windows"):
              raise SystemExit("Unknown package platform")
          root = pathlib.Path("dist/desktop")
          for arch in ("amd64", "arm64"):
              directory = root / (platform + "-" + arch)
              if platform == "linux":
                  verify_file(directory / "LICENSE")
                  package = one_file(directory, "*-linux-" + arch + ".tar.gz")
                  with tarfile.open(package, "r|gz") as archive:
                      verify_tar(archive, "LICENSE")
                  package = one_file(directory, "*.deb")
                  process = subprocess.Popen(["ar", "p", str(package), "data.tar.gz"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  deadline = threading.Timer(30, process.kill)
                  deadline.start()
                  try:
                      with tarfile.open(fileobj=process.stdout, mode="r|gz") as archive:
                          verify_tar(archive, "opt/cognate-desktop/LICENSE")
                      while process.stdout.read(65536):
                          pass
                      if process.wait(timeout=30) != 0:
                          raise SystemExit("Debian legal payload extraction failed")
                  finally:
                      deadline.cancel()
                      deadline.join()
                      process.stdout.close()
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=30)
              elif platform == "windows":
                  verify_file(directory / "LICENSE")
                  extractor = shutil.which("7z")
                  if extractor is None:
                      raise SystemExit("7z is required to verify the actual NSIS payload")
                  package = one_file(directory, "*-setup-*-" + arch + ".exe")
                  result = subprocess.run([extractor, "x", "-so", "-bsp0", str(package), "LICENSE"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=60, check=True)
                  verify_bytes(result.stdout)
              else:
                  verify_file(directory / "Cognate.app/Contents/Resources/LICENSE")
                  package = one_file(directory, "*-" + arch + ".dmg")
                  with tempfile.TemporaryDirectory(prefix="cognate-legal-", dir=os.environ["RUNNER_TEMP"]) as temporary:
                      mount = pathlib.Path(temporary) / "mounted"
                      mount.mkdir()
                      try:
                          subprocess.run(["hdiutil", "attach", "-readonly", "-nobrowse", "-noautoopen", "-mountpoint", str(mount), str(package)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60, check=True)
                          verify_file(mount / "Cognate.app/Contents/Resources/LICENSE")
                      finally:
                          subprocess.run(["hdiutil", "detach", str(mount)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60, check=True)
              print("Codex LICENSE+NOTICE verified:", platform, arch)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-unsigned
          path: dist/desktop/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-unsigned
          path: packages
      - name: Publish explicitly requested draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(jq -r .version cmd/cognate-desktop/mygo.json)
          test "$RELEASE_TAG" = "desktop-v$version"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          mapfile -d '' files < <(find packages -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*-setup-*.exe' \) -print0)
          test "${#files[@]}" -ge 8
          mkdir release
          cp -t release "${files[@]}"
          (cd release && sha256sum *) > SHA256SUMS
          mv SHA256SUMS release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Cognate Desktop $version (unsigned preview)" --notes 'Native desktop preview. macOS ad-hoc only, not Developer ID signed or notarized. Windows installers unsigned. Platform/product acceptance remains pending.'
          gh release upload "$RELEASE_TAG" release/*
