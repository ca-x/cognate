name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_LICENSE_SOURCE: internal/codexconfig/testdata/native-0.166.0/LICENSE
  CODEX_LICENSE_SHA256: 85e1d58a617d42cc2095caf2a4b4bac26d3d260b4907e3e7020be545192c6aa6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify readable Codex license input
        run: |
          test -f "$CODEX_LICENSE_SOURCE"
          test ! -L "$CODEX_LICENSE_SOURCE"
          printf '%s  %s\n' "$CODEX_LICENSE_SHA256" "$CODEX_LICENSE_SOURCE" | sha256sum -c -
      - name: Install private Secret Service test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: cognate-web
          path: web/dist
          if-no-files-found: error
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.75.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check protobuf generation and compatibility
        env:
          CGO_ENABLED: '0'
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          buf lint
          generated="$(mktemp -d)"
          buf generate -o "$generated"
          diff -ru gen "$generated/gen"
          buf generate --template buf.gen.web.yaml -o "$generated"
          diff -ru web/src/gen "$generated/web/src/gen"
          if [ ! -f "$generated/gen/skillhub/configuration/native/v1/native.pb.go" ] || [ ! -f "$generated/gen/skillhub/configuration/native/v1/configurationnativev1connect/native.connect.go" ]; then
            echo 'Native configuration Go generation is missing.' >&2
            exit 1
          fi
          if [ -e web/src/gen/skillhub/configuration/native ] || [ -e "$generated/web/src/gen/skillhub/configuration/native" ]; then
            echo 'Native configuration schema must not enter Web generation.' >&2
            exit 1
          fi
          if grep -REq --include='*.ts' --include='*.tsx' 'NativeConfigurationService|skillhub[./]configuration[./]native|configuration/native' web/src; then
            echo 'Native configuration business entry points must not enter Web source.' >&2
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo 'Cannot verify compatibility from a shallow repository.' >&2
              exit 1
            fi
          fi
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              base="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")"
              if [ "$base" = "$(git rev-parse HEAD)" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
                base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
              fi
            else
              base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [ -z "$base" ]; then
            echo 'No parent commit exists; skipping initial schema compatibility check.'
          else
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base"
            git cat-file -e "$base^{commit}"
            if [ -z "$(git ls-tree "$base" proto)" ]; then
              echo 'Baseline has no proto directory; this is an initial schema introduction.'
              exit 0
            fi
            if ! git cat-file -e "$base:buf.yaml" 2>/dev/null; then
              echo 'Baseline has proto files but no buf.yaml; compatibility cannot be verified.' >&2
              exit 1
            fi
            baseline="$(mktemp -d)"
            git archive "$base" buf.yaml proto | tar -x -C "$baseline"
            find "$baseline/proto" -type f -name '*.proto' -exec sed -i 's#option go_package = "github.com/ca-x/skillhub/#option go_package = "github.com/ca-x/cognate/#g' {} +
            buf breaking --against "$baseline"
          fi
      - name: Check single-CPU transaction cancellation cleanup
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '1'
        run: go test -mod=readonly ./internal/server/httpapi -run '^Test(Codex|Gemini)ConfigurationSQLiteInTransactionCancel$|^TestGeminiConfigurationFailureLoggingPrivacy$' -count=3 -timeout=120s
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=0 go vet ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: cognate-web
          path: web/dist
      - name: Build CLI client and server
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cognate-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="${name}.exe"; fi
          go build -trimpath -o "dist/$name" ./cmd/cognate
          name="cognate-server-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="${name}.exe"; fi
          go build -trimpath -o "dist/$name" ./cmd/cognate-server
          test -f "$CODEX_LICENSE_SOURCE"
          test ! -L "$CODEX_LICENSE_SOURCE"
          printf '%s  %s\n' "$CODEX_LICENSE_SHA256" "$CODEX_LICENSE_SOURCE" | sha256sum -c -
          cp "$CODEX_LICENSE_SOURCE" dist/CODEX-0.166.0-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cognate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: cognate-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cognate-binary-legal
      - name: Verify uploaded binary license payload
        timeout-minutes: 2
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/cognate-binary-legal
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          test -f "$ARTIFACT_DIR/cognate-$GOOS-$GOARCH$suffix"
          test -f "$ARTIFACT_DIR/cognate-server-$GOOS-$GOARCH$suffix"
          legal="$ARTIFACT_DIR/CODEX-0.166.0-LICENSE.txt"
          test -f "$legal"
          test ! -L "$legal"
          printf '%s  %s\n' "$CODEX_LICENSE_SHA256" "$legal" | sha256sum -c -

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: cognate-ci:${{ matrix.arch }}
          load: true
          outputs: type=oci,dest=/tmp/cognate-${{ matrix.arch }}.tar
      - name: Exercise the built container and persisted data
        timeout-minutes: 6
        env:
          SMOKE_IMAGE: cognate-ci:${{ matrix.arch }}
          SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          umask 077
          secrets="$(mktemp -d "$RUNNER_TEMP/cognate-container.XXXXXX")"
          wrong_key_log="$(mktemp "$RUNNER_TEMP/cognate-wrong-key.XXXXXX")"
          volume=""
          container="cognate-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMOKE_ARCH}"
          wrong_container="${container}-wrong-key"
          cleanup() {
            docker rm -f "$container" "$wrong_container" >/dev/null 2>&1 || true
            if [ -n "$volume" ]; then docker volume rm "$volume" >/dev/null 2>&1 || true; fi
            sudo rm -rf -- "$secrets"
            rm -f -- "$wrong_key_log"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          head -c 32 /dev/urandom > "$secrets/master.key"
          head -c 32 /dev/urandom > "$secrets/wrong.key"
          sudo chown -R 10001:10001 "$secrets"
          volume="$(docker volume create)"
          test "$(docker image inspect --format '{{.Architecture}}' "$SMOKE_IMAGE")" = "$SMOKE_ARCH"
          docker run --detach --name "$container" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,source=$volume,target=/data" \
            --mount "type=bind,source=$secrets,target=/run/cognate-secrets,readonly" \
            "$SMOKE_IMAGE" --data-dir /data --key-file /run/cognate-secrets/master.key \
            --listen 0.0.0.0:8080 --allow-http --list-sync-interval 0 >/dev/null
          wait_for_health() {
            for attempt in $(seq 1 120); do
              if [ "$(docker exec "$container" wget -q -O - http://127.0.0.1:8080/healthz 2>/dev/null || true)" = ok ]; then
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
                echo 'Container stopped before its health check.' >&2
                return 1
              fi
              sleep 1
            done
            echo 'Container health check exceeded its deadline.' >&2
            return 1
          }
          wait_for_health
          docker exec "$container" sh -ec 'test "$(id -u)" = 10001; test "$(stat -c %a /data)" = 700; test -f /data/server.db; wget -q -O /dev/null http://127.0.0.1:8080/'
          docker exec -e CODEX_LICENSE_SHA256 "$container" sh -ec 'legal=/usr/share/licenses/cognate/codex-0.166.0/LICENSE; test -f "$legal"; test ! -L "$legal"; test -r "$legal"; printf "%s  %s\n" "$CODEX_LICENSE_SHA256" "$legal" | sha256sum -c -'
          docker exec "$container" cognate --help >/dev/null
          docker stop --time 30 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          set +e
          timeout 60 docker run --rm --name "$wrong_container" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=volume,source=$volume,target=/data" \
            --mount "type=bind,source=$secrets,target=/run/cognate-secrets,readonly" \
            "$SMOKE_IMAGE" --data-dir /data --key-file /run/cognate-secrets/wrong.key \
            --listen 0.0.0.0:8080 --allow-http --list-sync-interval 0 \
            > "$wrong_key_log" 2>&1
          wrong_key_status=$?
          set -e
          test "$wrong_key_status" = 1
          grep -qF 'server credential encryption key does not match database' "$wrong_key_log"
          docker start "$container" >/dev/null
          wait_for_health
          docker stop --time 30 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          echo 'Container startup, private state, wrong-key refusal and restart checks passed.'
      - uses: actions/upload-artifact@v4
        with:
          name: cognate-docker-${{ matrix.arch }}
          path: /tmp/cognate-${{ matrix.arch }}.tar
          if-no-files-found: error
