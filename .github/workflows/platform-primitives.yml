name: Platform filesystem primitives

on:
  push:
    paths:
      - 'internal/objectid/**'
      - 'internal/install/**'
      - 'internal/skill/**'
      - 'internal/packclient/**'
      - 'internal/clientkey/**'
      - 'internal/cli/**'
      - 'internal/desktop/**'
      - 'internal/subscription/**'
      - 'internal/filelock/**'
      - 'internal/server/maintenance/**'
      - 'internal/server/state/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/platform-primitives.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

defaults:
  run:
    shell: bash

jobs:
  darwin-baseline-observation:
    name: Darwin baseline observation (NOT installation support)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare isolated native evidence and source identity
        shell: python {0}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import tempfile

          root = Path(tempfile.mkdtemp(prefix="cognate-darwin-baseline-", dir=os.environ["RUNNER_TEMP"]))
          os.chmod(root, 0o700)
          values = {"COGNATE_BASELINE_ROOT": str(root)}
          for name, relative in {
              "HOME": "home", "XDG_CONFIG_HOME": "config", "XDG_DATA_HOME": "data",
              "XDG_CACHE_HOME": "cache", "TMPDIR": "tmp", "GOPATH": "gopath", "GOCACHE": "go-build",
          }.items():
              path = root / relative
              path.mkdir(mode=0o700)
              values[name] = str(path)
          for relative in ["evidence", "bin", "sensitive", "insensitive"]:
              (root / relative).mkdir(mode=0o700)
          values["COGNATE_APFS_SENSITIVE"] = str(root / "sensitive")
          values["COGNATE_APFS_INSENSITIVE"] = str(root / "insensitive")
          values["COGNATE_DARWIN_BINARY"] = str(root / "bin" / "cognate")
          values["GOMODCACHE"] = str(root / "gopath" / "pkg" / "mod")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              for name, value in values.items():
                  target.write(f"{name}={value}\n")
          entries = []
          for entry in subprocess.check_output(["git", "ls-tree", "-rz", "HEAD"], timeout=15).split(b"\0"):
              if entry:
                  identity, path = entry.split(b"\t", 1)
                  mode, kind, blob = identity.decode().split()
                  entries.append({"path": path.decode(), "mode": mode, "type": kind, "blob": blob})
          manifest = {
              "phase": "baseline-observation-not-product-green",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], timeout=15).decode().strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], timeout=15).decode().strip(),
              "product_baseline": "86969a3e6b849349ad04f3f1105d4ccb1af2d40d",
              "actual_system": platform.system(), "actual_machine": platform.machine(), "tracked": entries,
          }
          (root / "evidence" / "source-identity.json").write_text(json.dumps(manifest, indent=2) + "\n")
          if platform.system() != "Darwin" or platform.machine() != "arm64":
              raise SystemExit("BLOCKED: actual macOS arm64 required")
      - name: Compile preview product and exact Darwin test oracles
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test "$(go env CGO_ENABLED)" = 0
          test "$(go env GOOS)" = darwin
          test "$(go env GOARCH)" = arm64
          go env GOOS GOARCH GOVERSION CGO_ENABLED > "$COGNATE_BASELINE_ROOT/evidence/toolchain.txt"
          for package in clientkey cli install desktop subscription; do
            go test -mod=readonly -c -o "$COGNATE_BASELINE_ROOT/bin/$package.test" "./internal/$package"
          done
          go build -mod=readonly -o "$COGNATE_DARWIN_BINARY" ./cmd/cognate
      - name: Create two disposable real APFS volumes (no fallback)
        shell: python {0}
        run: |
          import errno
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess

          root = Path(os.environ["COGNATE_BASELINE_ROOT"])
          receipts = {"creates": {}}
          def operation(command, role, stage, timeout):
              diagnostic = receipts["operation"] = {"role": role, "stage": stage, "exit": 0, "exit_known": False,
                                                     "output_limited": False, "class": "unconfirmed"}
              if stage == "create":
                  receipts["creates"][role] = diagnostic
              try:
                  result = subprocess.run(command, capture_output=True, timeout=timeout)
              except subprocess.TimeoutExpired:
                  diagnostic["class"] = "timeout"
                  raise RuntimeError("APFS fixture operation timed out") from None
              except OSError as error:
                  diagnostic["class"] = {errno.ENOENT: "launch-missing", errno.EACCES: "launch-permission"}.get(
                      error.errno, "launch-failed")
                  raise RuntimeError("APFS fixture operation unavailable") from None
              diagnostic["exit"] = result.returncode
              diagnostic["exit_known"] = True
              diagnostic["output_limited"] = len(result.stdout) + (0 if stage == "identity" else len(result.stderr)) > 65536
              diagnostic["class"] = "success"
              if diagnostic["output_limited"]:
                  diagnostic["class"] = "output-limit"
              elif result.returncode != 0:
                  diagnostic["class"] = "nonzero"
                  if stage in {"create", "attach"}:
                      prefix = ("hdiutil: " + stage + " failed - ").encode()
                      for message, category in [(b"Resource busy", "resource-busy"), (b"Invalid argument", "invalid-argument"),
                                                (b"Permission denied", "permission-denied"), (b"Operation not permitted", "not-permitted"),
                                                (b"No space left on device", "no-space"), (b"Operation not supported", "not-supported")]:
                          if result.stderr in {prefix + message, prefix + message + b"\n"}:
                              diagnostic["class"] = category
              return result
          try:
              commands_by_role = {}
              failed_create = None
              for label, kind in [("sensitive", "Case-sensitive APFS"), ("insensitive", "APFS")]:
                  receipt = receipts[label] = {}
                  commands = [
                      ("create", ["hdiutil", "create", "-size", "1g", "-type", "SPARSE", "-fs", kind,
                                  "-volname", "CognateFixture", str(root / (label + ".sparseimage"))]),
                      ("attach", ["hdiutil", "attach", "-nobrowse", "-mountpoint", str(root / label),
                                  str(root / (label + ".sparseimage"))]),
                  ]
                  commands_by_role[label] = commands
                  receipt["create_started"] = True
                  try:
                      result = operation(commands[0][1], label, "create", 45)
                      receipt["create_exit"] = result.returncode
                  except RuntimeError:
                      pass
                  if receipts["creates"][label]["class"] != "success" and failed_create is None:
                      failed_create = receipts["creates"][label]
              if failed_create is not None:
                  receipts["operation"] = failed_create
                  raise RuntimeError("APFS fixture operation failed")
              for label in ["sensitive", "insensitive"]:
                  receipt = receipts[label]
                  for stage, command in commands_by_role[label][1:]:
                      receipt[stage + "_started"] = True
                      result = operation(command, label, stage, 45)
                      receipt[stage + "_exit"] = result.returncode
                      if result.returncode != 0 or len(result.stdout) + len(result.stderr) > 65536:
                          raise RuntimeError("APFS fixture operation failed")
                  receipt["mounted"] = os.path.ismount(root / label)
                  info = operation(["diskutil", "info", "-plist", str(root / label)], label, "identity", 15)
                  receipt["diskutil_exit"] = info.returncode
                  if info.returncode != 0 or len(info.stdout) > 65536 or not receipt["mounted"]:
                      if info.returncode == 0 and len(info.stdout) <= 65536 and not receipt["mounted"]:
                          receipts["operation"]["class"] = "not-mounted"
                      raise RuntimeError("APFS identity receipt unavailable")
                  try:
                      parsed = plistlib.loads(info.stdout)
                      apfs = parsed.get("FilesystemType") == "apfs"
                  except Exception:
                      receipts["operation"]["class"] = "invalid-identity"
                      raise RuntimeError("APFS identity receipt unavailable") from None
                  receipt["apfs"] = apfs
                  if not receipt["apfs"]:
                      receipts["operation"]["class"] = "not-apfs"
                      raise RuntimeError("APFS identity mismatch")
          finally:
              (root / "evidence" / "volume-capability.json").write_text(json.dumps(receipts, indent=2) + "\n")
      - name: Native capability PASS then raw product baseline RED observation
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import selectors
          import subprocess
          import time

          root = Path(os.environ["COGNATE_BASELINE_ROOT"])
          evidence = root / "evidence"
          import re
          import signal
          import stat
          environment = {name: os.environ[name] for name in [
              "PATH", "HOME", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_CACHE_HOME", "TMPDIR",
              "GOPATH", "GOCACHE", "COGNATE_APFS_SENSITIVE", "COGNATE_APFS_INSENSITIVE", "COGNATE_DARWIN_BINARY",
          ]}
          environment.update(CGO_ENABLED="0", GOTOOLCHAIN="local", GOFLAGS="-mod=readonly")
          cases = [
              ("install", "TestDarwinAPFSExecutionPrerequisites", None),
              ("cli", "TestDarwinPTYExecutionPrerequisites", None),
              ("clientkey", "TestDarwinExecutionCoreExplicitInitialization", None),
              ("cli", "TestDarwinExecutionCLIAdmission", "cli-unsupported"),
              ("cli", "TestDarwinExecutionCLIRealPTY", "pty-sink-unsupported"),
              ("install", "TestDarwinExecutionLocalInstall", "install-unsupported"),
              ("desktop", "TestDarwinExecutionDesktopServiceInstall", "desktop-unsupported"),
              ("subscription", "TestDarwinExecutionPackLifecycle", "pack-core-unsupported"),
          ]
          receipts = []
          assertions = {
              "core-unsupported": "Darwin core must require explicit initialization",
              "cli-unsupported": "Darwin CLI must admit through explicit-init core",
              "pty-sink-unsupported": "Darwin actual terminal client-key init must succeed",
              "install-unsupported": "Darwin local installation must succeed",
              "desktop-unsupported": "Darwin native service must require explicit initialization",
              "pack-core-unsupported": "Darwin real Pack CLI command must succeed",
          }
          capability_sources = {
              "TestDarwinAPFSExecutionPrerequisites": ("install", "platform_volume_darwin_test.go", "apfs", [
                  "DARWIN_INFRA requires actual arm64 runner",
                  "DARWIN_INFRA requires two mounted APFS fixtures",
                  "DARWIN_INFRA mounted volume missing",
                  "DARWIN_INFRA native stat unavailable",
                  "DARWIN_INFRA filesystem identity unavailable",
                  "DARWIN_INFRA fixture is not APFS",
                  "DARWIN_INFRA fixture devices are identical",
                  "DARWIN_INFRA volume fixture creation",
                  "DARWIN_INFRA volume fixture cleanup",
                  "DARWIN_INFRA case fixture",
                  "DARWIN_INFRA sensitive volume folds case",
                  "DARWIN_INFRA case close",
                  "DARWIN_INFRA insensitive volume admits case alias",
                  "DARWIN_INFRA Unicode fixture",
                  "DARWIN_INFRA Unicode equivalent unexpectedly distinct",
                  "DARWIN_INFRA rename source",
                  "DARWIN_INFRA directory handle",
                  "DARWIN_INFRA no-replace primitive failed",
                  "DARWIN_INFRA cross-device fixture cleanup",
                  "DARWIN_INFRA cross-device source",
                  "DARWIN_INFRA cross-device rename did not reject",
                  "DARWIN_INFRA cross-device source changed",
                  "DARWIN_INFRA cross-device destination created",
              ]),
              "TestDarwinPTYExecutionPrerequisites": ("cli", "platform_output_darwin_test.go", "pty", [
                  "DARWIN_INFRA PTY child deadline or incomplete drain",
                  "DARWIN_INFRA PTY process unavailable",
                  "DARWIN_INFRA duplicate PTY exit receipt",
                  "DARWIN_INFRA invalid PTY exit receipt",
                  "DARWIN_INFRA missing actual PTY child/exit receipt",
                  "DARWIN_INFRA canonical private PTY home",
                  "DARWIN_INFRA isolated PTY environment",
                  "DARWIN_INFRA actual controlling PTY unavailable",
              ]),
          }
          capability_diagnostics = {"schema": 1, "records": [
              {"test_name": name, "attempted": False, "exit_known": False, "exit": 0,
               "timeout": False, "failure_class": "unknown"} for name in capability_sources
          ]}
          def write_capability_diagnostics():
              try:
                  descriptor = os.open(evidence / "capability-diagnostics.json",
                                       os.O_WRONLY | os.O_CREAT | os.O_NOFOLLOW | os.O_NONBLOCK, 0o600)
                  with os.fdopen(descriptor, "w", encoding="utf-8") as output:
                      info = os.fstat(output.fileno())
                      if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.geteuid()
                              or stat.S_IMODE(info.st_mode) != 0o600):
                          return
                      data = (json.dumps(capability_diagnostics, sort_keys=True) + "\n").encode()
                      if len(data) > 2048:
                          return
                      output.truncate(0)
                      output.write(data.decode())
              except Exception:
                  pass
          def capability_events(path):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError
                      result[key] = value
                  return result
              try:
                  with path.open("rb") as source:
                      data = source.read((4 << 20) + 1)
                  lines = data.splitlines()
                  if len(data) > 4 << 20 or len(lines) > 16:
                      return []
                  return [json.loads(line, object_pairs_hook=unique) for line in lines]
              except Exception:
                  return []
          def pty_details_valid(details):
              fields = {"schema", "test_name", "script_terminal", "script_exit_known", "script_exit",
                        "script_signal", "capture", "child_marker", "target_marker", "eot_prefix"}
              if type(details) is not dict or set(details) != fields:
                  return False
              if (type(details["schema"]) is not int or details["schema"] != 1
                      or details["test_name"] != "TestDarwinPTYExecutionPrerequisites"
                      or type(details["script_exit_known"]) is not bool
                      or type(details["script_exit"]) is not int or not 0 <= details["script_exit"] <= 255):
                  return False
              enums = {
                  "script_terminal": {"unknown", "exited", "signaled", "launch-failed"},
                  "script_signal": {"unknown", "hup", "int", "quit", "kill", "term", "other"},
                  "capture": {"empty", "nonempty"},
                  "child_marker": {"absent", "anchored-invalid", "anchored-valid", "nonanchored-only"},
                  "target_marker": {"absent", "anchored-invalid", "anchored-negative", "anchored-nonnegative", "duplicate", "nonanchored-only"},
                  "eot_prefix": {"absent", "fixed-caret-D", "unknown"},
              }
              if any(type(details[key]) is not str or details[key] not in values for key, values in enums.items()):
                  return False
              if details["script_terminal"] == "exited":
                  if not details["script_exit_known"] or details["script_signal"] != "unknown":
                      return False
              elif details["script_exit_known"] or details["script_exit"] != 0:
                  return False
              if (details["script_terminal"] == "signaled") != (details["script_signal"] != "unknown"):
                  return False
              if details["capture"] == "empty" and any(details[key] != "absent" for key in ["child_marker", "target_marker", "eot_prefix"]):
                  return False
              return True
          def pty_diagnostic_events(events):
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate diagnostic field")
                      result[key] = value
                  return result
              if type(events) is not list or not 1 <= len(events) <= 16:
                  raise ValueError("missing diagnostic")
              found = []
              for index, event in enumerate(events):
                  if type(event) is not dict:
                      raise ValueError("invalid diagnostic event")
                  output = event.get("Output", "")
                  if type(output) is not str:
                      raise ValueError("invalid diagnostic output")
                  if "DARWIN_PTY_DIAGNOSTIC" not in output:
                      continue
                  if (set(event) - {"Time", "Action", "Package", "Test", "Elapsed", "Output"}
                          or event.get("Action") != "output"
                          or event.get("Package") != "github.com/ca-x/cognate/internal/cli"
                          or event.get("Test") != "TestDarwinPTYExecutionPrerequisites"
                          or len(output.encode()) > 1024):
                      raise ValueError("invalid diagnostic identity")
                  if "Elapsed" in event and (type(event["Elapsed"]) not in (int, float) or not 0 <= event["Elapsed"] < 1000):
                      raise ValueError("invalid diagnostic elapsed")
                  if "Time" in event and (type(event["Time"]) is not str or not re.fullmatch(
                          r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})", event["Time"])):
                      raise ValueError("invalid diagnostic time")
                  match = re.fullmatch(r"    platform_output_darwin_test\.go:120: DARWIN_PTY_DIAGNOSTIC ([^\n]+)\n", output)
                  if match is None:
                      raise ValueError("invalid diagnostic source")
                  details = json.loads(match[1], object_pairs_hook=unique)
                  if not pty_details_valid(details):
                      raise ValueError("invalid diagnostic details")
                  found.append((index, details))
              if len(found) != 1 or found[0][0] != 3:
                  raise ValueError("missing or duplicate diagnostic")
              index, details = found[0]
              return events[:index] + events[index + 1:], details
          def capability_failure(name, events):
              try:
                  package, filename, prefix, messages = capability_sources[name]
                  roles = [("start", None), ("run", name), ("output", name), ("output", name),
                           ("output", name), ("fail", name), ("output", None), ("fail", None)]
                  if type(events) is not list or len(events) != len(roles):
                      return "unknown"
                  for event, (action, target) in zip(events, roles):
                      if (type(event) is not dict or set(event) - {"Time", "Action", "Package", "Test", "Elapsed", "Output", "OutputType"}
                              or event.get("Action") != action or event.get("Test") != target
                              or event.get("Package") != "github.com/ca-x/cognate/internal/" + package):
                          return "unknown"
                      if "Elapsed" in event and (type(event["Elapsed"]) not in (int, float) or not 0 <= event["Elapsed"] < 1000):
                          return "unknown"
                      if "Time" in event and (type(event["Time"]) is not str or not re.fullmatch(
                              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})", event["Time"])):
                          return "unknown"
                      if action != "output" and ("Output" in event or "OutputType" in event):
                          return "unknown"
                  if (events[2].get("Output") != "=== RUN   " + name + "\n" or events[2].get("OutputType") != "frame"
                          or events[6].get("Output") != "FAIL\n" or events[6].get("OutputType") != "frame"
                          or events[4].get("OutputType") != "frame" or not re.fullmatch(
                              r"--- FAIL: " + re.escape(name) + r" \([0-9]+(?:\.[0-9]+)?s\)\n", events[4].get("Output", ""))
                          or events[3].get("OutputType") != "error"):
                      return "unknown"
                  match = re.fullmatch(r"    " + re.escape(filename) + r":[1-9][0-9]*: ([^\n]+)\n", events[3].get("Output", ""))
                  if match is None or match[1] not in messages:
                      return "unknown"
                  return prefix + "-" + str(messages.index(match[1]) + 1).zfill(2)
              except Exception:
                  return "unknown"
          def capture_native(command, path, environment, diagnostic=None):
              try:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                             env=environment, start_new_session=True)
              except OSError:
                  if diagnostic is not None:
                      diagnostic["failure_class"] = "capture-launch"
                  raise
              selector = None
              deadline = time.monotonic() + 100
              try:
                  selector = selectors.DefaultSelector()
                  os.set_blocking(process.stdout.fileno(), False)
                  selector.register(process.stdout, selectors.EVENT_READ)
                  with path.open("xb") as output:
                      size = 0
                      while True:
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              if diagnostic is not None:
                                  diagnostic.update(timeout=True, failure_class="capture-timeout")
                              raise RuntimeError("native capture deadline")
                          if not selector.select(min(remaining, 1)):
                              continue
                          data = os.read(process.stdout.fileno(), min(65536, (4 << 20) - size + 1))
                          if not data:
                              break
                          available = (4 << 20) - size
                          output.write(data[:available])
                          size += min(len(data), available)
                          if len(data) > available:
                              if diagnostic is not None:
                                  diagnostic["failure_class"] = "capture-limit"
                              raise RuntimeError("native capture byte limit")
                  code = process.wait(timeout=max(0.001, deadline - time.monotonic()))
              except BaseException as error:
                  if diagnostic is not None and isinstance(error, subprocess.TimeoutExpired):
                      diagnostic.update(timeout=True, failure_class="capture-timeout")
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=5)
                  raise
              finally:
                  if selector is not None:
                      selector.close()
                  process.stdout.close()
                  if diagnostic is not None and type(process.returncode) is int and -255 <= process.returncode <= 255:
                      diagnostic.update(exit_known=True, exit=process.returncode)
                  path.with_suffix(".exit").write_text(str(process.returncode) + "\n")
              return code
          def classify(package, name, expected, events, code):
              capabilities = {
                  "TestDarwinAPFSExecutionPrerequisites": "DARWIN_CAPABILITY apfs=true arm64=true case_sensitive=true case_insensitive=true unicode_alias=true distinct_devices=true no_replace=true cross_device_refused=true",
                  "TestDarwinPTYExecutionPrerequisites": "DARWIN_CAPABILITY actual_control_tty=true child_exit=0 script_waited=true bounded_capture=true",
              }
              if expected is None:
                  if name not in capabilities and name != "TestDarwinExecutionCoreExplicitInitialization" or code != 0:
                      raise RuntimeError("native capability not proven")
                  messages = [capabilities[name]] if name in capabilities else []
                  terminal = "pass"
              else:
                  if expected not in assertions or code != 1:
                      raise RuntimeError("invalid baseline process result")
                  marker = "DARWIN_BASELINE_REJECTION code=" + expected
                  if expected == "pty-sink-unsupported":
                      marker += " child_exit=1 business_state=false"
                  messages = [marker, assertions[expected]]
                  terminal = "fail"
              roles = [("start", None), ("run", name), ("output", name)]
              roles += [("output", name)] * len(messages)
              roles += [("output", name), (terminal, name), ("output", None), (terminal, None)]
              if len(events) != len(roles):
                  raise RuntimeError("unexpected native events")
              for event, (action, target) in zip(events, roles):
                  if (not isinstance(event, dict) or set(event) - {"Time", "Action", "Package", "Test", "Elapsed", "Output", "OutputType"}
                          or event.get("Action") != action or event.get("Test") != target
                          or event.get("Package") != "github.com/ca-x/cognate/internal/" + package):
                      raise RuntimeError("unexpected native event identity or terminal")
                  if "Elapsed" in event and (type(event["Elapsed"]) not in (int, float) or not 0 <= event["Elapsed"] < 1000):
                      raise RuntimeError("unexpected elapsed receipt")
                  if "Time" in event and (not isinstance(event["Time"], str) or not re.fullmatch(
                          r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})", event["Time"])):
                      raise RuntimeError("unexpected timestamp receipt")
                  if action != "output" and ("Output" in event or "OutputType" in event):
                      raise RuntimeError("unexpected event output")
              frames = [(2, "=== RUN   " + name + "\n"), (-2, terminal.upper() + "\n")]
              for index, text in frames:
                  if events[index].get("Output") != text or events[index].get("OutputType") != "frame":
                      raise RuntimeError("unexpected native framework output")
              end = events[3 + len(messages)]
              if (end.get("OutputType") != "frame" or not re.fullmatch(
                      r"--- " + terminal.upper() + ": " + re.escape(name) + r" \([0-9]+(?:\.[0-9]+)?s\)\n", end.get("Output", ""))):
                  raise RuntimeError("unexpected native framework terminal")
              for index, (event, message) in enumerate(zip(events[3:], messages)):
                  valid_type = event.get("OutputType") == "error" if expected is not None and index == 1 else "OutputType" not in event
                  if (not valid_type or not re.fullmatch(r"    [a-z_]+\.go:[1-9][0-9]*: " + re.escape(message) + r"\n", event.get("Output", ""))):
                      raise RuntimeError("unknown native error or output")
          def execute(package, name, expected):
              path = evidence / (name + ".json")
              diagnostic = next((record for record in capability_diagnostics["records"]
