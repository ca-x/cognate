                                                    "launch-missing", "launch-permission", "launch-failed", "resource-busy",
                                                    "invalid-argument", "permission-denied", "not-permitted", "no-space",
                                                    "not-supported", "not-mounted", "invalid-identity", "not-apfs"}:
                          return False
                      if type(operation["output_limited"]) is not bool or type(operation["exit_known"]) is not bool:
                          return False
                      if type(operation["exit"]) is not int or not -255 <= operation["exit"] <= 255:
                          return False
                      unknown_exit = {"unconfirmed", "timeout", "launch-missing", "launch-permission", "launch-failed"}
                      if not operation["exit_known"]:
                          return operation["exit"] == 0 and not operation["output_limited"] and operation["class"] in unknown_exit
                      if operation["class"] in unknown_exit:
                          return False
                      if operation["class"] == "output-limit":
                          return operation["output_limited"]
                      if operation["output_limited"]:
                          return False
                      if operation["class"] in {"success", "not-mounted", "invalid-identity", "not-apfs"}:
                          return operation["exit"] == 0 and (operation["class"] == "success" or operation["stage"] == "identity")
                      return operation["exit"] != 0
                  if not valid_operation(parsed["operation"]) or set(parsed["creates"]) != {"sensitive", "insensitive"}:
                      return unknown
                  for role in ["sensitive", "insensitive"]:
                      create = parsed["creates"][role]
                      if not valid_operation(create) or create["role"] != role or create["stage"] != "create":
                          return unknown
                      receipt = parsed[role]
                      if not isinstance(receipt, dict) or not receipt or set(receipt) - {
                              "create_started", "create_exit", "attach_started", "attach_exit", "mounted", "diskutil_exit", "apfs"}:
                          return unknown
                      for key, value in receipt.items():
                          if key.endswith("_exit"):
                              if type(value) is not int or not -255 <= value <= 255:
                                  return unknown
                          elif type(value) is not bool:
                              return unknown
                      if receipt.get("create_started") is not True or create["exit_known"] != ("create_exit" in receipt):
                          return unknown
                      if create["exit_known"] and receipt["create_exit"] != create["exit"]:
                          return unknown
                  first_failure = next((parsed["creates"][role] for role in ["sensitive", "insensitive"]
                                        if parsed["creates"][role]["class"] != "success"), None)
                  if first_failure is not None and parsed["operation"] != first_failure:
                      return unknown
                  return parsed
              except Exception:
                  return unknown
          def cleanup_receipt(data=None):
              unknown = {"classification": "cleanup-unconfirmed"}
              try:
                  parsed = receipt_json(read_file("cleanup.json") if data is None else data)
                  if set(parsed) != {"failed", "volumes", "auxiliary_failures"} or type(parsed["failed"]) is not bool:
                      return unknown
                  if set(parsed["volumes"]) != {"sensitive", "insensitive"}:
                      return unknown
                  required = {"was_mounted", "still_mounted", "attachment_unknown", "creation_unknown"}
                  optional = {"detach_exit", "detach_timeout", "remove_failed"}
                  for receipt in parsed["volumes"].values():
                      if not required <= set(receipt) or set(receipt) - required - optional:
                          return unknown
                      for key, value in receipt.items():
                          if key == "detach_exit":
                              if type(value) is not int or not -255 <= value <= 255:
                                  return unknown
                          elif type(value) is not bool:
                              return unknown
                  failures = parsed["auxiliary_failures"]
                  if not isinstance(failures, list) or len(failures) > 8:
                      return unknown
                  seen = set()
                  for failure in failures:
                      if set(failure) != {"role", "class"} or failure["role"] not in {
                              "home", "config", "data", "cache", "tmp", "gopath", "go-build", "bin"}:
                          return unknown
                      if failure["role"] in seen or failure["class"] not in {
                              "missing", "permission-denied", "not-permitted", "resource-busy", "not-directory",
                              "not-empty", "read-only", "io", "other", "unsafe-cache", "cache-limit", "cache-clean-failed", "cache-clean-timeout"}:
                          return unknown
                      if failure["class"] in {"unsafe-cache", "cache-limit", "cache-clean-failed", "cache-clean-timeout"} and failure["role"] != "gopath":
                          return unknown
                      seen.add(failure["role"])
                  if failures and not parsed["failed"]:
                      return unknown
                  return parsed
              except Exception:
                  return unknown
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate event field")
                  value[key] = item
              return value
          def validate_core(data, package, names):
              counts = {action: collections.Counter() for action in ["run", "pass"]}
              packages = collections.Counter()
              frames = collections.Counter()
              for line in data.splitlines():
                  event = json.loads(line, object_pairs_hook=unique)
                  if (type(event) is not dict or set(event) - {"Time", "Action", "Package", "Test", "Elapsed", "Output", "OutputType"}
                          or event.get("Package") != "github.com/ca-x/cognate/internal/" + package):
                      raise ValueError("unknown event identity")
                  action, name = event.get("Action"), event.get("Test")
                  if action not in {"start", "run", "pass", "output"} or name is not None and name not in names:
                      raise ValueError("failed, skipped or unknown test")
                  if ("Test" in event and type(name) is not str or action == "start" and name is not None
                          or action == "run" and name is None):
                      raise ValueError("invalid test event role")
                  if "Time" in event and (type(event["Time"]) is not str or not re.fullmatch(
                          r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:Z|[+-][0-9]{2}:[0-9]{2})", event["Time"])):
                      raise ValueError("invalid event clock")
                  if "Elapsed" in event and (type(event["Elapsed"]) not in (int, float) or not 0 <= event["Elapsed"] <= 150):
                      raise ValueError("invalid elapsed receipt")
                  if action == "output":
                      text = event.get("Output")
                      if type(text) is not str or event.get("OutputType") != "frame":
                          raise ValueError("unknown output type")
                      if name is None:
                          valid = text == "PASS\n"
                          frame = "pass"
                      else:
                          valid = text == "=== RUN   " + name + "\n" or re.fullmatch(
                              r"[ ]*--- PASS: " + re.escape(name) + r" \([0-9]+(?:\.[0-9]+)?s\)\n", text)
                          frame = "run" if text == "=== RUN   " + name + "\n" else "pass"
                      if not valid:
                          raise ValueError("unknown test output")
                      frames[(name, frame)] += 1
                  elif "Output" in event or "OutputType" in event:
                      raise ValueError("unexpected output payload")
                  if name is not None and action in counts:
                      counts[action][name] += 1
                  elif name is None and action != "output":
                      packages[action] += 1
              expected = collections.Counter({name: 1 for name in names})
              expected_frames = collections.Counter({(name, frame): 1 for name in names for frame in ["run", "pass"]})
              expected_frames[(None, "pass")] = 1
              if (counts["run"] != expected or counts["pass"] != expected or packages != {"start": 1, "pass": 1}
                      or frames != expected_frames):
                  raise ValueError("missing or duplicate terminal test receipt")
          def core_payloads(baseline, baseline_rejected):
              if baseline_rejected or platform.system() != "Darwin" or platform.machine() != "arm64":
                  raise ValueError("baseline or native identity unconfirmed")
              cleanup = cleanup_receipt(baseline["cleanup.json"])
              volume = volume_receipt(baseline["volume-capability.json"])
              if ("classification" in cleanup or cleanup["failed"] or cleanup["auxiliary_failures"]
                      or "classification" in volume):
                  raise ValueError("fixture or cleanup unconfirmed")
              for role in ["sensitive", "insensitive"]:
                  removed = cleanup["volumes"][role]
                  mounted = volume[role]
                  if (removed.get("was_mounted") is not True or removed.get("still_mounted") is not False
                          or removed.get("attachment_unknown") is not False or removed.get("creation_unknown") is not False
                          or removed.get("detach_exit") != 0 or removed.get("detach_timeout", False) is not False
                          or removed.get("remove_failed", False) is not False
                          or mounted.get("mounted") is not True or mounted.get("apfs") is not True
                          or mounted.get("attach_exit") != 0 or mounted.get("diskutil_exit") != 0
                          or volume["creates"][role]["class"] != "success"):
                      raise ValueError("fixture or cleanup unsuccessful")
              def git(*arguments):
                  return subprocess.check_output(["git", "-C", os.environ["GITHUB_WORKSPACE"], *arguments], stderr=subprocess.DEVNULL, timeout=15)
              commit = git("rev-parse", "HEAD").decode().strip()
              tree = git("rev-parse", "HEAD^{tree}").decode().strip()
              if commit != os.environ["GITHUB_SHA"]:
                  raise ValueError("checkout identity mismatch")
              tracked = []
              for entry in git("ls-tree", "-rz", "HEAD").split(b"\0"):
                  if entry:
                      identity, path = entry.split(b"\t", 1)
                      mode, kind, blob = identity.decode().split()
                      tracked.append({"path": path.decode(), "mode": mode, "type": kind, "blob": blob})
              source = receipt_json(baseline["source-identity.json"])
              if source != {"phase": "baseline-observation-not-product-green", "commit": commit, "tree": tree,
                            "product_baseline": "86969a3e6b849349ad04f3f1105d4ccb1af2d40d",
                            "actual_system": "Darwin", "actual_machine": "arm64", "tracked": tracked}:
                  raise ValueError("source identity mismatch")
              top = {"TestClientKeyPOSIXLifecycle", "TestClientKeyPOSIXRefusals",
                     "TestClientKeyPOSIXLockAndCancellation", "TestClientKeyPOSIXConcurrent"}
              common = top | {"TestClientKeyPOSIXRefusals/" + name + "/" + kind
                              for name in ["client.key", "client-key-use.v1", "client-key.init.lock", "client.db.install.lock", "client.db"]
                              for kind in ["symlink", "hardlink", "fifo", "public"]}
              cases = [("sensitive", "clientkey", common), ("insensitive", "clientkey", common),
                       ("cli-isolation", "cli", {"TestClientKeyEntrypointsUnsupported"}),
                       ("desktop-isolation", "desktop", {"TestClientKeyEntrypointsUnsupported", "TestUnsupportedInstallationIsHonest"})]
              limits = {role + ".jsonl": (1 << 20) - 1 for role, package, names in cases}
              limits["summary.json"] = 16384
              private = root / "core-security-private"
              root_info = root.lstat()
              if (root.resolve() != root or not stat.S_ISDIR(root_info.st_mode) or root_info.st_uid != os.geteuid()
                      or stat.S_IMODE(root_info.st_mode) != 0o700):
                  raise ValueError("unsafe root")
              descriptor = os.open(private, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  before_directory = os.fstat(descriptor)
                  def identity(info):
                      return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
                  if before_directory.st_uid != os.geteuid() or stat.S_IMODE(before_directory.st_mode) != 0o700:
                      raise ValueError("unsafe private directory")
                  captured = {}
                  with os.scandir(descriptor) as entries:
                      for entry in entries:
                          if entry.name not in limits or entry.name in captured or len(captured) >= len(limits):
                              raise ValueError("unknown private evidence")
                          file_descriptor = os.open(entry.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=descriptor)
                          with os.fdopen(file_descriptor, "rb") as raw:
                              before = os.fstat(raw.fileno())
                              if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid != os.geteuid()
                                      or stat.S_IMODE(before.st_mode) != 0o600 or not 0 < before.st_size <= limits[entry.name]):
                                  raise ValueError("unsafe private evidence")
                              data = raw.read(limits[entry.name] + 1)
                              after = os.fstat(raw.fileno())
                              linked = os.stat(entry.name, dir_fd=descriptor, follow_symlinks=False)
                              if len(data) != before.st_size or identity(before) != identity(after) or identity(after) != identity(linked):
                                  raise ValueError("changed private evidence")
                              captured[entry.name] = data
                  if (set(captured) != set(limits) or identity(before_directory) != identity(os.fstat(descriptor))
                          or identity(before_directory) != identity(private.lstat())):
                      raise ValueError("incomplete or changed private directory")
              finally:
                  os.close(descriptor)
              summary = receipt_json(captured["summary.json"])
              fields = {"schema", "scope", "commit", "tree", "system", "machine", "apfs_identities",
                        "source_identity_sha256", "volume_capability_sha256", "receipts"}
              if (type(summary) is not dict or set(summary) != fields or type(summary["schema"]) is not int
                      or summary["schema"] != 1 or summary["scope"] != "Darwin client-key core only, callers remain unsupported"
                      or summary["commit"] != commit or summary["tree"] != tree or summary["system"] != "Darwin"
                      or summary["machine"] != "arm64"
                      or summary["source_identity_sha256"] != hashlib.sha256(baseline["source-identity.json"]).hexdigest()
                      or summary["volume_capability_sha256"] != hashlib.sha256(baseline["volume-capability.json"]).hexdigest()):
                  raise ValueError("security identity mismatch")
              identities = summary["apfs_identities"]
              if (type(identities) is not list or len(identities) != 2
                      or any(type(item) is not list or len(item) != 2 or any(type(value) is not int or not 0 < value < 1 << 64 for value in item)
                             for item in identities) or identities[0][0] == identities[1][0]):
                  raise ValueError("invalid APFS identities")
              receipts = []
              for role, package, names in cases:
                  data = captured[role + ".jsonl"]
                  validate_core(data, package, names)
                  receipts.append({"role": role, "package": package, "tests": sorted(names), "exit": 0,
                                   "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              if (type(summary["receipts"]) is not list or len(summary["receipts"]) != 4
                      or any(type(item) is not dict or type(item.get("exit")) is not int or type(item.get("bytes")) is not int
                             for item in summary["receipts"]) or summary["receipts"] != receipts):
                  raise ValueError("security receipts mismatch")
              for name in ["source-identity.json", "volume-capability.json", "cleanup.json"]:
                  captured[name] = baseline[name]
              if sum(len(data) for data in captured.values()) > (4 << 20) - 4096:
                  raise ValueError("total core evidence limit")
              return captured
          rejected = False
          try:
              directory = os.open(evidence, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              payloads = {}
              total = 0
              count = 0
              with os.scandir(directory) as entries:
                  for entry in entries:
                      count += 1
                      if count > len(allow) or entry.name not in allow or entry.name in payloads:
                          raise ValueError("unknown evidence entry")
                      if entry.name == "capability-diagnostics.json":
                          continue
                      data = read_file(entry.name)
                      total += len(data)
                      if total > 12 << 20:
                          raise ValueError("total evidence limit")
                      payloads[entry.name] = data
              payloads["capability-diagnostics.json"] = (json.dumps(capability_receipt(), sort_keys=True) + "\n").encode()
              total += len(payloads["capability-diagnostics.json"])
              if total > 12 << 20:
                  raise ValueError("total evidence limit")
              if (set(payloads) != set(allow) or "classification" in cleanup_receipt(payloads["cleanup.json"])
                      or "classification" in volume_receipt(payloads["volume-capability.json"])):
                  raise ValueError("incomplete evidence")
              volume = volume_receipt(payloads["volume-capability.json"])
              if cleanup_receipt(payloads["cleanup.json"])["failed"] or any(
                      not create["exit_known"] or create["exit"] != 0 or create["output_limited"] or create["class"] != "success"
                      for create in volume["creates"].values()):
                  raise ValueError("unsuccessful fixture")
              expected = [{"test": name, "raw_exit": 0 if index < 3 else 1,
                           "classification": ("capability-pass" if index < 2 else "product-pass" if index == 2 else
                                              "baseline-unsupported-assertion-RED")}
                          for index, name in enumerate(names)]
              if json.loads(payloads["observation.json"]) != expected:
                  raise ValueError("unclassified evidence")
              if "pty_details" not in capability_receipt()["records"][1]:
                  raise ValueError("missing closed PTY diagnostic")
              for receipt in expected:
                  if payloads[receipt["test"] + ".exit"] != (str(receipt["raw_exit"]) + "\n").encode():
                      raise ValueError("invalid raw exit receipt")
          except Exception:
              rejected = True
              volume = volume_receipt()
              payloads = {
                  "refusal.json": (json.dumps({"classification": "evidence-rejected", "reason": "invalid-or-incomplete-evidence",
                                               "operation": volume.get("operation", {"classification": "operation-unconfirmed"}),
                                               "creates": volume.get("creates", {"classification": "creates-unconfirmed"})},
                                              sort_keys=True) + "\n").encode(),
                  "cleanup.json": (json.dumps(cleanup_receipt(), sort_keys=True) + "\n").encode(),
                  "capability-diagnostics.json": (json.dumps(capability_receipt(), sort_keys=True) + "\n").encode(),
              }
          finally:
              if directory is not None:
                  os.close(directory)
          target = Path(tempfile.mkdtemp(prefix="sealed-upload-", dir=root))
          manifest = []
          for name, data in sorted(payloads.items()):
              (target / name).write_bytes(data)
              manifest.append({"name": name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          (target / "evidence-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("path=" + str(target) + "\nready=true\n")
          core_rejected = False
          try:
              core = core_payloads(payloads, rejected)
          except Exception:
              core_rejected = True
              core = {
                  "refusal.json": b'{"classification":"core-evidence-rejected","reason":"invalid-or-incomplete-evidence"}\n',
                  "cleanup.json": (json.dumps(cleanup_receipt(payloads.get("cleanup.json", b"{}")), sort_keys=True) + "\n").encode(),
              }
          core_target = Path(tempfile.mkdtemp(prefix="sealed-core-upload-", dir=root))
          core_manifest = []
          for name, data in sorted(core.items()):
              with (core_target / name).open("xb") as destination:
                  destination.write(data)
                  destination.flush()
                  os.fsync(destination.fileno())
              core_manifest.append({"name": name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          with (core_target / "evidence-manifest.json").open("x", encoding="utf-8") as destination:
              destination.write(json.dumps(core_manifest, indent=2) + "\n")
              destination.flush()
              os.fsync(destination.fileno())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("core_path=" + str(core_target) + "\ncore_ready=true\n")
          if rejected:
              raise SystemExit("BLOCKED: evidence rejected; only fixed refusal and cleanup receipt sealed")
          if core_rejected:
              raise SystemExit("BLOCKED: core evidence rejected; only fixed refusal and cleanup receipt sealed")
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outputs.ready == 'true'
        with:
          name: darwin-baseline-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.seal.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outputs.core_ready == 'true'
        with:
          name: darwin-core-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.seal.outputs.core_path }}
          if-no-files-found: error
          retention-days: 7
  primitives:
    name: Primitives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Isolate home, configuration, caches and temporary files
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import tempfile

          root = Path(tempfile.mkdtemp(prefix="cognate-primitives-", dir=os.environ["RUNNER_TEMP"]))
          directories = {
              "HOME": "home", "USERPROFILE": "home",
              "XDG_CONFIG_HOME": "config", "XDG_DATA_HOME": "data", "XDG_CACHE_HOME": "cache",
              "APPDATA": "appdata", "LOCALAPPDATA": "localappdata",
              "TMPDIR": "tmp", "TMP": "tmp", "TEMP": "tmp",
              "GOPATH": "gopath", "GOCACHE": "go-build",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, relative in directories.items():
                  path = root / relative
                  path.mkdir(parents=True, exist_ok=True)
                  environment.write(f"{name}={path}\n")
      - name: Require Go 1.27.3 and CGO disabled
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          test "$(go env CGO_ENABLED)" = 0
          go env GOOS GOARCH GOVERSION CGO_ENABLED
      - name: Common identity parser and portable smoke (no installer)
        run: |
          set -euo pipefail
          go test -count=1 -timeout=120s -json \
            -run '^(TestValidate|TestIdentityDirectoryDomain|TestPortableSlugsAreCrossPlatform|TestScanFindsHiddenAndNestedSkills|TestScanSkipsGitMetadata|TestScanRejectsMalformedFrontmatter|TestConcurrencyBudgetIsFailFastAndReusable|TestPublicClientDoesNotFollowRedirects|TestPublicClientCancellationAndOriginBoundary)$' \
            ./internal/objectid ./internal/skill ./internal/packclient | tee common.json
      - name: Darwin TempDir filesystem primitives (native execution)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          go test -count=1 -timeout=120s -json \
            -run '^TestDarwin(IdentityPrimitives|TrustPrimitives|ProjectionLinkPrimitives|RenameNoReplacePrimitives)$' \
            ./internal/install | tee darwin.json
          go vet ./internal/install
      - name: Store platform validation boundary (native execution)
        run: |
          set -euo pipefail
          go test -count=1 -timeout=120s -json \
            -run '^Test(ManagedStorePlatformValidationPrecedence|ManagedStorePlatformCheckPrecedesFilesystem|DefaultStoreRemainsOutsideManagedProtocol)$' \
            ./internal/server/state | tee state-platform.json
      - name: Reject skipped or missing required tests
        shell: python {0}
        run: |
          from collections import Counter
          import json
          import os
          from pathlib import Path

          required = {
              "internal/objectid": ["TestValidate", "TestIdentityDirectoryDomain"],
              "internal/skill": [
                  "TestPortableSlugsAreCrossPlatform", "TestScanFindsHiddenAndNestedSkills",
                  "TestScanSkipsGitMetadata", "TestScanRejectsMalformedFrontmatter",
              ],
              "internal/packclient": [
                  "TestConcurrencyBudgetIsFailFastAndReusable", "TestPublicClientDoesNotFollowRedirects",
                  "TestPublicClientCancellationAndOriginBoundary",
              ],
              "internal/server/state": [
                  "TestManagedStorePlatformValidationPrecedence",
                  "TestManagedStorePlatformCheckPrecedesFilesystem",
                  "TestDefaultStoreRemainsOutsideManagedProtocol",
              ],
          }
          logs = [Path("common.json"), Path("state-platform.json")]
          if os.environ["RUNNER_OS"] == "macOS":
              required["internal/install"] = [
                  "TestDarwinIdentityPrimitives", "TestDarwinTrustPrimitives",
                  "TestDarwinProjectionLinkPrimitives", "TestDarwinRenameNoReplacePrimitives",
              ]
              logs.append(Path("darwin.json"))
          events = [json.loads(line) for path in logs for line in path.read_text(encoding="utf-8").splitlines()]
          rejected = [event for event in events if event["Action"] in {"fail", "skip"}]
          if rejected:
              raise SystemExit(f"Skipped or failed tests: {rejected}")
          runs = Counter((event.get("Package"), event.get("Test")) for event in events if event["Action"] == "run")
          passes = Counter((event.get("Package"), event.get("Test")) for event in events if event["Action"] == "pass")
          prefix = "github.com/ca-x/cognate/"
          for package, names in required.items():
              if passes[(prefix + package, None)] != 1:
                  raise SystemExit(f"Missing package pass: {package}")
              for name in names:
                  key = (prefix + package, name)
                  if runs[key] != 1 or passes[key] != 1:
                      raise SystemExit(f"Required test did not run and pass exactly once: {key}")
          print(f"Verified {sum(map(len, required.values()))} required tests; no skips or missing matches.")
      - name: Vet common primitive and portable packages
        run: go vet ./internal/objectid ./internal/skill ./internal/packclient
