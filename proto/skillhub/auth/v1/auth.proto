syntax = "proto3";

package skillhub.auth.v1;

option go_package = "github.com/ca-x/skillhub/gen/skillhub/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetLoginOptions(GetLoginOptionsRequest) returns (GetLoginOptionsResponse);
  rpc StartOIDCLogin(StartOIDCLoginRequest) returns (StartOIDCLoginResponse);
  rpc CompleteOIDCLogin(CompleteOIDCLoginRequest) returns (CompleteOIDCLoginResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string session_token = 1;
  int64 expires_at_unix = 2;
}

message GetSessionRequest {}

message GetSessionResponse {
  string user_id = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message GetLoginOptionsRequest {}

message GetLoginOptionsResponse {
  bool oidc_enabled = 1;
}

message StartOIDCLoginRequest {
  bool link_current_account = 1;
}

message StartOIDCLoginResponse {
  string authorization_url = 1;
}

message CompleteOIDCLoginRequest {}

message CompleteOIDCLoginResponse {
  string session_token = 1;
  int64 expires_at_unix = 2;
  string user_id = 3;
}
