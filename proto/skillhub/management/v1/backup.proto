syntax = "proto3";

package skillhub.management.v1;

option go_package = "github.com/ca-x/cognate/gen/skillhub/management/v1;managementv1";

service BackupManagementService {
  rpc GetBackupSettings(GetBackupSettingsRequest) returns (GetBackupSettingsResponse);
  rpc UpdateBackupSettings(UpdateBackupSettingsRequest) returns (UpdateBackupSettingsResponse);
  rpc GetBackupStatus(GetBackupStatusRequest) returns (GetBackupStatusResponse);
  rpc StartBackup(StartBackupRequest) returns (StartBackupResponse);
  rpc GetBackupJob(GetBackupJobRequest) returns (GetBackupJobResponse);
  rpc ListBackupJobs(ListBackupJobsRequest) returns (ListBackupJobsResponse);
  rpc CancelBackupJob(CancelBackupJobRequest) returns (CancelBackupJobResponse);
  rpc ReconcileBackupJob(ReconcileBackupJobRequest) returns (ReconcileBackupJobResponse);
}

message BackupSettings {
  bool enabled = 1;
  int64 automatic_interval_seconds = 2;
  string endpoint = 3;
  string region = 4;
  string bucket = 5;
  string prefix = 6;
  string recovery_key_id = 7;
  string recovery_key_file = 8;
  int64 max_database_bytes = 9;
  int64 max_content_bytes = 10;
  int64 job_timeout_seconds = 11;
  int64 revision = 12;
  bool credentials_configured = 13;
}

message GetBackupSettingsRequest {}
message GetBackupSettingsResponse { BackupSettings settings = 1; }
message UpdateBackupSettingsRequest {
  int64 expected_revision = 1;
  BackupSettings settings = 2;
  string credentials_action = 3;
  string access_key_id = 4 [debug_redact = true];
  string secret_access_key = 5 [debug_redact = true];
  string session_token = 6 [debug_redact = true];
}
message UpdateBackupSettingsResponse { BackupSettings settings = 1; }

message BackupJob {
  string id = 1;
  string phase = 2;
  string error_code = 3;
  int64 created_unix_millis = 4;
  int64 updated_unix_millis = 5;
  uint32 objects = 6;
  int64 ciphertext_bytes = 7;
  bool cancel_requested = 8;
}

message GetBackupStatusRequest {}

message GetBackupStatusResponse {
  bool enabled = 1;
  string scope = 2;
  bool automatic_enabled = 3;
  bool restore_available = 4;
}

message StartBackupRequest {
  string request_id = 1;
}

message StartBackupResponse {
  BackupJob job = 1;
}

message GetBackupJobRequest {
  string job_id = 1;
}

message GetBackupJobResponse {
  BackupJob job = 1;
}

message ListBackupJobsRequest {
  int32 limit = 1;
  string cursor = 2;
}

message ListBackupJobsResponse {
  repeated BackupJob jobs = 1;
  string next_cursor = 2;
}

message CancelBackupJobRequest {
  string job_id = 1;
}

message CancelBackupJobResponse {
  BackupJob job = 1;
}

message ReconcileBackupJobRequest {
  string job_id = 1;
}

message ReconcileBackupJobResponse {
  BackupJob job = 1;
}
