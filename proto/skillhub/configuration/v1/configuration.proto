syntax = "proto3";

package skillhub.configuration.v1;

option go_package = "github.com/ca-x/cognate/gen/skillhub/configuration/v1;configurationv1";

service ConfigurationService {
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ReadDraft(ReadDraftRequest) returns (ReadDraftResponse);
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc CopyAsset(CopyAssetRequest) returns (CopyAssetResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_PROVIDER = 1;
  ASSET_KIND_MCP = 2;
  ASSET_KIND_PROMPT = 3;
  ASSET_KIND_AGENT_SETTINGS = 4;
  ASSET_KIND_WORKSPACE = 5;
}

enum ClaudeAuthMode {
  CLAUDE_AUTH_MODE_UNSPECIFIED = 0;
  CLAUDE_AUTH_MODE_NATIVE_LOGIN = 1;
  CLAUDE_AUTH_MODE_API_KEY = 2;
  CLAUDE_AUTH_MODE_AUTH_TOKEN = 3;
}

enum CodexAuthMode {
  CODEX_AUTH_MODE_UNSPECIFIED = 0;
  CODEX_AUTH_MODE_PROVIDER_KEY = 1;
}

enum CodexReasoningEffort {
  CODEX_REASONING_EFFORT_UNSPECIFIED = 0;
  CODEX_REASONING_EFFORT_NONE = 1;
  CODEX_REASONING_EFFORT_MINIMAL = 2;
  CODEX_REASONING_EFFORT_LOW = 3;
  CODEX_REASONING_EFFORT_MEDIUM = 4;
  CODEX_REASONING_EFFORT_HIGH = 5;
  CODEX_REASONING_EFFORT_XHIGH = 6;
  CODEX_REASONING_EFFORT_MAX = 7;
}

enum CodexModality {
  CODEX_MODALITY_UNSPECIFIED = 0;
  CODEX_MODALITY_TEXT = 1;
  CODEX_MODALITY_IMAGE = 2;
}

enum CredentialReadiness {
  CREDENTIAL_READINESS_UNSPECIFIED = 0;
  CREDENTIAL_READINESS_COMPLETE = 1;
  CREDENTIAL_READINESS_NEEDS_CREDENTIAL = 2;
}

message Asset {
  string id = 1;
  string agent_id = 2;
  AssetKind kind = 3;
  string name = 4;
  uint32 schema_version = 5;
  int64 revision = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
}

message ClaudeModels {
  optional string default_model = 1;
  optional string haiku = 2;
  optional string sonnet = 3;
  optional string opus = 4;
}

message ClaudeProvider {
  optional string endpoint = 1;
  ClaudeAuthMode auth_mode = 2;
  ClaudeModels models = 3;
}

message CodexModalities {
  repeated CodexModality values = 1;
}

message CodexReasoningLevels {
  repeated CodexReasoningEffort values = 1;
}

message CodexCatalogModel {
  string model = 1;
  optional string display_name = 2;
  optional uint64 context_window = 3;
  optional bool supports_parallel_tool_calls = 4;
  CodexModalities input_modalities = 5;
  optional string base_instructions = 6;
  CodexReasoningLevels reasoning_levels = 7;
  optional CodexReasoningEffort default_reasoning_level = 8;
}

message CodexCatalog {
  repeated CodexCatalogModel models = 1;
}

message CodexProvider {
  CodexAuthMode auth_mode = 1;
  string endpoint = 2;
  string model = 3;
  optional CodexReasoningEffort reasoning_effort = 4;
  CodexCatalog catalog = 5;
}

message Draft {
  string name = 1;
  oneof payload {
    ClaudeProvider claude_provider = 2;
    CodexProvider codex_provider = 3;
  }
}

message SecretStatus {
  string slot_id = 1;
  bool present = 2;
}

message KeepSecret {}
message ClearSecret {}

message SecretMutation {
  string slot_id = 1;
  oneof action {
    KeepSecret keep = 2;
    string replace = 3 [debug_redact = true];
    ClearSecret clear = 4;
  }
}

message DraftView {
  Asset asset = 1;
  Draft draft = 2;
  repeated SecretStatus secrets = 3;
  CredentialReadiness credential_readiness = 4;
  bool has_preserved_extras = 5;
}

message ListAssetsRequest {}
message ListAssetsResponse {
  repeated Asset assets = 1;
}

message GetAssetRequest {
  string id = 1;
}
message GetAssetResponse {
  Asset asset = 1;
}

message ReadDraftRequest {
  string id = 1;
}
message ReadDraftResponse {
  DraftView view = 1;
}

message CreateAssetRequest {
  Draft draft = 1;
  repeated SecretMutation secrets = 2;
}
message CreateAssetResponse {
  DraftView view = 1;
}

message UpdateAssetRequest {
  string id = 1;
  int64 expected_revision = 2;
  Draft draft = 3;
  repeated SecretMutation secrets = 4;
}
message UpdateAssetResponse {
  DraftView view = 1;
}

message CopyAssetRequest {
  string source_id = 1;
  int64 expected_source_revision = 2;
  string name = 3;
}
message CopyAssetResponse {
  DraftView view = 1;
}

message DeleteAssetRequest {
  string id = 1;
  int64 expected_revision = 2;
}
message DeleteAssetResponse {}
