syntax = "proto3";

package skillhub.configuration.v1;

option go_package = "github.com/ca-x/cognate/gen/skillhub/configuration/v1;configurationv1";

service ConfigurationService {
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ReadDraft(ReadDraftRequest) returns (ReadDraftResponse);
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc CopyAsset(CopyAssetRequest) returns (CopyAssetResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
  rpc GetAssetOrder(GetAssetOrderRequest) returns (GetAssetOrderResponse);
  rpc ReplaceAssetOrder(ReplaceAssetOrderRequest) returns (ReplaceAssetOrderResponse);
}

enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_PROVIDER = 1;
  ASSET_KIND_MCP = 2;
  ASSET_KIND_PROMPT = 3;
  ASSET_KIND_AGENT_SETTINGS = 4;
  ASSET_KIND_WORKSPACE = 5;
}

enum ClaudeAuthMode {
  CLAUDE_AUTH_MODE_UNSPECIFIED = 0;
  CLAUDE_AUTH_MODE_NATIVE_LOGIN = 1;
  CLAUDE_AUTH_MODE_API_KEY = 2;
  CLAUDE_AUTH_MODE_AUTH_TOKEN = 3;
}

enum CodexAuthMode {
  CODEX_AUTH_MODE_UNSPECIFIED = 0;
  CODEX_AUTH_MODE_PROVIDER_KEY = 1;
}

enum GeminiAuthMode {
  GEMINI_AUTH_MODE_UNSPECIFIED = 0;
  GEMINI_AUTH_MODE_NATIVE_LOGIN = 1;
  GEMINI_AUTH_MODE_API_KEY = 2;
}

enum GeminiKeyTransport {
  GEMINI_KEY_TRANSPORT_UNSPECIFIED = 0;
  GEMINI_KEY_TRANSPORT_NATIVE_DEFAULT = 1;
  GEMINI_KEY_TRANSPORT_BEARER = 2;
}

enum CodexReasoningEffort {
  CODEX_REASONING_EFFORT_UNSPECIFIED = 0;
  CODEX_REASONING_EFFORT_NONE = 1;
  CODEX_REASONING_EFFORT_MINIMAL = 2;
  CODEX_REASONING_EFFORT_LOW = 3;
  CODEX_REASONING_EFFORT_MEDIUM = 4;
  CODEX_REASONING_EFFORT_HIGH = 5;
  CODEX_REASONING_EFFORT_XHIGH = 6;
  CODEX_REASONING_EFFORT_MAX = 7;
}

enum CodexModality {
  CODEX_MODALITY_UNSPECIFIED = 0;
  CODEX_MODALITY_TEXT = 1;
  CODEX_MODALITY_IMAGE = 2;
}

enum CredentialReadiness {
  CREDENTIAL_READINESS_UNSPECIFIED = 0;
  CREDENTIAL_READINESS_COMPLETE = 1;
  CREDENTIAL_READINESS_NEEDS_CREDENTIAL = 2;
}

message Asset {
  string id = 1;
  string agent_id = 2;
  AssetKind kind = 3;
  string name = 4;
  uint32 schema_version = 5;
  int64 revision = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
}

message ClaudeModels {
  optional string default_model = 1;
  optional string haiku = 2;
  optional string sonnet = 3;
  optional string opus = 4;
}

message ClaudeProvider {
  optional string endpoint = 1;
  ClaudeAuthMode auth_mode = 2;
  ClaudeModels models = 3;
}

message CodexModalities {
  repeated CodexModality values = 1;
}

message CodexReasoningLevels {
  repeated CodexReasoningEffort values = 1;
}

message CodexCatalogModel {
  string model = 1;
  optional string display_name = 2;
  optional uint64 context_window = 3;
  optional bool supports_parallel_tool_calls = 4;
  CodexModalities input_modalities = 5;
  optional string base_instructions = 6;
  CodexReasoningLevels reasoning_levels = 7;
  optional CodexReasoningEffort default_reasoning_level = 8;
}

message CodexCatalog {
  repeated CodexCatalogModel models = 1;
}

message CodexProvider {
  CodexAuthMode auth_mode = 1;
  string endpoint = 2;
  string model = 3;
  optional CodexReasoningEffort reasoning_effort = 4;
  CodexCatalog catalog = 5;
}

message GeminiProvider {
  GeminiAuthMode auth_mode = 1;
  optional string endpoint = 2;
  optional GeminiKeyTransport key_transport = 3;
  optional string env_model = 4;
  optional string settings_model = 5;
}

message Draft {
  string name = 1;
  oneof payload {
    ClaudeProvider claude_provider = 2;
    CodexProvider codex_provider = 3;
    GeminiProvider gemini_provider = 4;
    OpenCodeProvider opencode_provider = 5;
  }
}

message SecretStatus {
  string slot_id = 1;
  bool present = 2;
}

message KeepSecret {}
message ClearSecret {}

message SecretMutation {
  string slot_id = 1;
  oneof action {
    KeepSecret keep = 2;
    string replace = 3 [debug_redact = true];
    ClearSecret clear = 4;
  }
}

message DraftView {
  Asset asset = 1;
  Draft draft = 2;
  repeated SecretStatus secrets = 3;
  CredentialReadiness credential_readiness = 4;
  bool has_preserved_extras = 5;
}

message ListAssetsRequest {}
message GetAssetOrderRequest {
  string agent_id = 1;
  AssetKind kind = 2;
}

message ReplaceAssetOrderRequest {
  string agent_id = 1;
  AssetKind kind = 2;
  int64 expected_revision = 3;
  repeated string asset_ids = 4;
}

message AssetOrderSnapshot {
  string agent_id = 1;
  AssetKind kind = 2;
  int64 revision = 3;
  repeated Asset assets = 4;
}

message GetAssetOrderResponse {
  AssetOrderSnapshot snapshot = 1;
}

message ReplaceAssetOrderResponse {
  AssetOrderSnapshot snapshot = 1;
}

message OpenCodeProvider {
  string provider_id = 1;
  oneof format {
    OpenCodeV1 v1 = 2;
    OpenCodeV2 v2 = 3;
  }
}

message OpenCodeValue {
  oneof value {
    bool null = 1;
    bool boolean = 2;
    string number = 3;
    string literal = 4 [debug_redact = true];
    OpenCodeArray array = 5;
    OpenCodeObject object = 6;
    string secret_reference = 7;
  }
}

message OpenCodeArray {
  repeated OpenCodeValue values = 1;
}

message OpenCodeObject {
  map<string, OpenCodeValue> entries = 1;
}

message OpenCodeStrings {
  repeated string values = 1;
}

message OpenCodeHeaders {
  map<string, string> entries = 1;
}

message OpenCodeV1Models {
  map<string, OpenCodeV1Model> entries = 1;
}

message OpenCodeV2Models {
  map<string, OpenCodeV2Model> entries = 1;
}

message OpenCodeV1 {
  optional string npm = 1;
  optional string name = 2;
  OpenCodeV1Options options = 3;
  OpenCodeV1Models models = 4;
  OpenCodeObject extensions = 5;
}

message OpenCodeV1Options {
  optional string base_url = 1;
  optional string api_key = 2;
  OpenCodeHeaders headers = 3;
  OpenCodeObject extensions = 4;
}

message OpenCodeV1Model {
  optional string name = 1;
  OpenCodeLimit limit = 2;
  OpenCodeObject options = 3;
  OpenCodeModalities modalities = 4;
  OpenCodeValue thinking = 5;
  OpenCodeValue cost = 6;
  OpenCodeObject variants = 7;
  OpenCodeObject extensions = 8;
}

message OpenCodeLimit {
  optional string context = 1;
  optional string input = 2;
  optional string output = 3;
  OpenCodeObject extensions = 4;
}

message OpenCodeModalities {
  OpenCodeStrings input = 1;
  OpenCodeStrings output = 2;
  OpenCodeObject extensions = 3;
}

message OpenCodeV2 {
  optional string package = 1;
  optional string name = 2;
  optional string canonical = 3;
  OpenCodeStrings env = 4;
  OpenCodeSettings settings = 5;
  OpenCodeHeaders headers = 6;
  OpenCodeObject body = 7;
  OpenCodeV2Models models = 8;
  OpenCodeObject extensions = 9;
}

message OpenCodeSettings {
  OpenCodeTimeout timeout = 1;
  optional string chunk_timeout = 2;
  OpenCodeCompaction compaction = 3;
  optional string transport = 4;
  OpenCodeObject extensions = 5;
}

message OpenCodeTimeout {
  oneof value {
    string number = 1;
    bool disabled = 2;
  }
}

message OpenCodeCompaction {
  string type = 1;
  OpenCodeObject extensions = 2;
}

message OpenCodeModelSettings {
  OpenCodeCompaction compaction = 1;
  OpenCodeObject extensions = 2;
}

message OpenCodeV2Model {
  optional string model_id = 1;
  optional string family = 2;
  optional string name = 3;
  optional string package = 4;
  optional bool disabled = 5;
  OpenCodeModelSettings settings = 6;
  OpenCodeHeaders headers = 7;
  OpenCodeObject body = 8;
  OpenCodeCompatibility compatibility = 9;
  OpenCodeCapabilities capabilities = 10;
  OpenCodeLimit limit = 11;
  OpenCodeCosts cost = 12;
  OpenCodeVariants variants = 13;
  OpenCodeObject extensions = 14;
}

message OpenCodeVariant {
  string id = 1;
  OpenCodeModelSettings settings = 2;
  OpenCodeHeaders headers = 3;
  OpenCodeObject body = 4;
  OpenCodeObject extensions = 5;
}

message OpenCodeVariants {
  repeated OpenCodeVariant values = 1;
}

message OpenCodeCompatibility {
  OpenCodeValue reasoning_field = 1;
  optional bool require_reasoning = 2;
  optional string max_tokens_field = 3;
  optional bool require_finish_reason = 4;
  optional bool require_assistant_after_tool = 5;
  optional bool supports_prompt_cache_key = 6;
  OpenCodeObject extensions = 7;
}

message OpenCodeCapabilities {
  optional bool tools = 1;
  OpenCodeStrings input = 2;
  OpenCodeStrings output = 3;
  OpenCodeObject extensions = 4;
}

message OpenCodeCosts {
  oneof shape {
    OpenCodeCost single = 1;
    OpenCodeCostList tiers = 2;
  }
}

message OpenCodeCostList {
  repeated OpenCodeCost values = 1;
}

message OpenCodeCost {
  optional string input = 1;
  optional string output = 2;
  OpenCodeCacheCost cache = 3;
  OpenCodeCostTier tier = 4;
  OpenCodeObject extensions = 5;
}

message OpenCodeCacheCost {
  optional string read = 1;
  optional string write = 2;
  OpenCodeObject extensions = 3;
}

message OpenCodeCostTier {
  string type = 1;
  optional string size = 2;
  OpenCodeObject extensions = 3;
}
message ListAssetsResponse {
  repeated Asset assets = 1;
}

message GetAssetRequest {
  string id = 1;
}
message GetAssetResponse {
  Asset asset = 1;
}

message ReadDraftRequest {
  string id = 1;
}
message ReadDraftResponse {
  DraftView view = 1;
}

message CreateAssetRequest {
  Draft draft = 1;
  repeated SecretMutation secrets = 2;
}
message CreateAssetResponse {
  DraftView view = 1;
}

message UpdateAssetRequest {
  string id = 1;
  int64 expected_revision = 2;
  Draft draft = 3;
  repeated SecretMutation secrets = 4;
}
message UpdateAssetResponse {
  DraftView view = 1;
}

message CopyAssetRequest {
  string source_id = 1;
  int64 expected_source_revision = 2;
  string name = 3;
}
message CopyAssetResponse {
  DraftView view = 1;
}

message DeleteAssetRequest {
  string id = 1;
  int64 expected_revision = 2;
}
message DeleteAssetResponse {}
